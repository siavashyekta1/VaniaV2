x-base-environment:
  env_file:
    - .env
  entrypoint:
    - /app/start.sh
  restart: always
services:
  app:
    image: 'vaniaapp-backend:bonyad'
    pull_policy: never
    env_file:
      - .env
    entrypoint:
      - /app/start.sh
    restart: always
    command: 'gunicorn core.asgi:application --preload --timeout 120 -w ${WEB_CONCURRENCY:-2} -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000'
    ports:
      - '8001:8000'
    extra_hosts:
      - "api.gapgpt.app:185.143.234.235"
      - "my.pcoiran.ir:185.143.233.235"
      - "my.pcoiran.ir:185.143.234.235"
      - "search.icbar.org:62.220.117.130"
      - "api.sms.ir:185.211.56.44"
      - "gateway.zibal.ir:185.143.235.201"
      - "gateway.zibal.ir:185.143.232.201"

    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_started
  frontend:
    image: 'vaniaapp-frontend:bonyad'
    pull_policy: never
    container_name: vania_frontend
    environment:
      - 'NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}'
    env_file:
      - .env
    ports:
      - '3000:3000'
    restart: always
    depends_on:
      - app
  worker:
    image: 'vaniaapp-backend:bonyad'
    pull_policy: never
    env_file:
      - .env
    entrypoint:
      - /app/start.sh
    restart: always
    command: 'celery -A core worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-2} --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-200}'
    extra_hosts:
      - "api.gapgpt.app:185.143.234.235"
      - "my.pcoiran.ir:185.143.233.235"
      - "my.pcoiran.ir:185.143.234.235"
      - "search.icbar.org:62.220.117.130"
      - "api.sms.ir:185.211.56.44"
      - "gateway.zibal.ir:185.143.235.201"
      - "gateway.zibal.ir:185.143.232.201"
    depends_on:
      - app
      - cache
      - db
  beat:
    image: 'vaniaapp-backend:bonyad'
    pull_policy: never
    env_file:
      - .env
    entrypoint:
      - /app/start.sh
    restart: always
    command: 'celery -A core beat -l info'
    extra_hosts:
      - "api.gapgpt.app:185.143.234.235"
      - "my.pcoiran.ir:185.143.233.235"
      - "my.pcoiran.ir:185.143.234.235"
      - "search.icbar.org:62.220.117.130"
      - "api.sms.ir:185.211.56.44"
      - "gateway.zibal.ir:185.143.235.201"
      - "gateway.zibal.ir:185.143.232.201"
    depends_on:
      - app
      - cache
      - db
  db:
    image: 'postgres:15-alpine'
    pull_policy: never
    container_name: vania_postgres
    environment:
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_DB=${POSTGRES_DB}'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
  cache:
    image: 'redis:7-alpine'
    pull_policy: never
    container_name: vania_redis
    command: 'redis-server --appendonly yes'
    volumes:
      - 'redis_data:/data'
    restart: always
  minio:
    image: 'quay.io/minio/minio:RELEASE.2023-11-01T01-57-10Z-cpuv1'
    pull_policy: never
    container_name: vania_minio
    command: 'server /data --console-address ":9001"'
    environment:
      - 'MINIO_ROOT_USER=${MINIO_ROOT_USER}'
      - 'MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}'
      - 'MINIO_SERVER_URL=https://files.vaniaapp.app'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - 'minio_data:/data'
    networks:
      - coolify
      - default
    labels:
      - "traefik.enable=true"
      - "coolify.managed=true"
      - "traefik.docker.network=coolify"
      # Route external traffic to port 9000 using HTTPS
      - "traefik.http.routers.minio-api.rule=Host(`files.vaniaapp.app`)"
      - "traefik.http.routers.minio-api.entrypoints=https"
      - "traefik.http.routers.minio-api.tls=true"
      - "traefik.http.routers.minio-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
    healthcheck:
      test:
        - CMD-SHELL
        - '/usr/bin/mc ready local || exit 1'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: always
  createbuckets:
    image: 'quay.io/minio/minio:RELEASE.2023-11-01T01-57-10Z-cpuv1'
    pull_policy: never
    restart: 'no'
    depends_on:
      - minio
    environment:
      - 'MINIO_ROOT_USER=${MINIO_ROOT_USER}'
      - 'MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}'
    # Replaced 'minio:9000' with 'vania_minio:9000' below:
    entrypoint: "/bin/sh -c \" until /usr/bin/mc alias set myminio http://vania_minio:9000 \\${MINIO_ROOT_USER} \\${MINIO_ROOT_PASSWORD}; do\n  echo 'Waiting for MinIO...';\n  sleep 2;\ndone; /usr/bin/mc mb myminio/vania-media || true; /usr/bin/mc anonymous set public myminio/vania-media; exit 0; \"\n"
  qdrant:
    image: qdrant/qdrant
    pull_policy: never
    container_name: vania_qdrant
    volumes:
      - 'qdrant_data:/qdrant/storage'
    restart: always
volumes:
  postgres_data: null
  redis_data: null
  minio_data: null
  qdrant_data: null

networks:
  coolify:
    external: true
